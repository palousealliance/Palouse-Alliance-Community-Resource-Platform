<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />

    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="description" content="A community-focused platform organizing Palouse area events, organizations, and resources into an accessible hub." />
    <link rel="canonical" href="https://www.palousealliance.org/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Palouse Alliance" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://www.palousealliance.org/" />
    <meta property="og:title" content="Palouse Alliance" />
    <meta property="og:description" content="A community-focused platform organizing Palouse area events, organizations, and resources into an accessible hub." />
    <meta property="og:image" content="https://www.palousealliance.org/PalouseSquareLogo.png" />
    <meta property="og:image:width" content="446" />
    <meta property="og:image:height" content="446" />
    <meta property="og:image:alt" content="Palouse Alliance Logo" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Palouse Alliance" />
    <meta name="twitter:description" content="A community-focused platform organizing Palouse area events, organizations, and resources into an accessible hub." />
    <meta name="twitter:image" content="https://www.palousealliance.org/PalouseSquareLogo.png" />
    <meta name="twitter:image:alt" content="Palouse Alliance Logo" />
    
    <!-- Google Fonts Preconnect & Stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "NGO",
          "@id": "https://www.palousealliance.org/#organization",
          "name": "Palouse Alliance",
          "url": "https://www.palousealliance.org/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.palousealliance.org/PalouseSquareLogo.png",
            "width": 446,
            "height": 446
          },
          "image": "https://www.palousealliance.org/PalouseSquareLogo.png",
          "description": "A community-focused platform organizing Palouse area events, organizations, and resources into an accessible hub.",
          "foundingDate": "1984",
          "email": "palousealliance@gmail.com",
          "areaServed": [
            {
              "@type": "AdministrativeArea",
              "name": "Palouse Region"
            },
            {
              "@type": "City",
              "name": "Pullman, WA"
            },
            {
              "@type": "City",
              "name": "Moscow, ID"
            }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.palousealliance.org/#website",
          "url": "https://www.palousealliance.org/",
          "name": "Palouse Alliance",
          "publisher": {
            "@id": "https://www.palousealliance.org/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.palousealliance.org/events?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    
    <title>Palouse Alliance</title>
  </head>
  <body>
    <div id="root"></div>
